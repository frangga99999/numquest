[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Di production, panggil API lewat Netlify Functions (relatif)
  VITE_API = "/api"

# Rewrite /api/* ke Netlify Function — HARUS di atas SPA fallback
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

# SPA fallback — semua rute lain ke index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
